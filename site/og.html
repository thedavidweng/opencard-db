<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenCard DB og:image source (1200x630)</title>
<!-- Render at 1200x630 and screenshot to og.png, e.g. with Playwright:
     page.setViewportSize({ width: 1200, height: 630 }); page.screenshot({ path: "og.png" }) -->
<link rel="stylesheet" href="style.css">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; background: #ffffff; color-scheme: light; }
  .og { box-sizing: border-box; width: 1200px; height: 630px; padding: 84px 96px; display: flex; flex-direction: column; justify-content: space-between; border-top: 6px solid #2b5ce6; }
  .og .brand { font-size: 26px; gap: 14px; color: #0f0f11; }
  .og .mark { width: 36px; height: 36px; }
  .og h1 { font-size: 84px; max-width: 13ch; letter-spacing: -0.045em; color: #0f0f11; }
  .og .bar { display: flex; align-items: center; justify-content: space-between; color: #55555e; font-size: 24px; }
  .og .q { display: flex; align-items: center; gap: 14px; width: 560px; height: 68px; padding: 0 22px; border: 1px solid #d4d4da; border-radius: 14px; font-size: 22px; color: #6b6b74; background: #fff; box-shadow: 0 1px 2px rgba(15,15,17,.04), 0 4px 16px rgba(15,15,17,.05); }
  .og .q svg { width: 24px; height: 24px; }
  .og .url { font-family: var(--mono); font-size: 20px; color: #6b6b74; }
</style>
</head>
<body>
<div class="og">
  <span class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 9.5h19" stroke="currentColor" stroke-width="1.6"/><rect x="5.5" y="13" width="5" height="2.4" rx="1" fill="#2b5ce6"/></svg>
    OpenCard DB
  </span>
  <h1>The open database of credit cards.</h1>
  <div class="bar">
    <span class="q"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.75" cy="8.75" r="5.75" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Search cards, issuers, networks</span>
    <span class="url">JSON · CSV · YAML · REST API</span>
  </div>
</div>
</body>
</html>
