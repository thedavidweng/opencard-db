<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OpenCard DB social image source</title>
<!--
  Source for og.png, the 1200 by 630 social preview image.
  Render it from the repository root with headless Chromium, for example

    npx playwright screenshot --viewport-size=1200,630 site/og.html site/og.png

  The page uses the self-hosted Geist fonts in site/fonts and no network
  resources, so the output is the same on any machine with Chromium.
-->
<style>
  @font-face { font-family: "Geist"; src: url("fonts/geist-latin.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("fonts/geist-mono-latin.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #ffffff; }
  body { -webkit-font-smoothing: antialiased; font-family: "Geist", system-ui, sans-serif; color: #0f0f11; }
  .og { position: relative; width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 80px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .brand svg { width: 32px; height: 32px; }
  h1 { position: absolute; left: 80px; top: 226px; margin: 0; width: 660px; font-size: 74px; line-height: 1.02; font-weight: 600; letter-spacing: -0.045em; }
  .url { position: absolute; right: 80px; top: 79px; font: 400 18px/1 "Geist Mono", ui-monospace, monospace; color: #6b6b74; letter-spacing: -0.01em; }
  .cards { position: absolute; right: -56px; top: 150px; width: 460px; height: 372px; filter: drop-shadow(0 1px 2px rgba(15,15,17,.04)) drop-shadow(0 12px 32px rgba(15,15,17,.06)); }
</style>
</head>
<body>
<div class="og">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3" fill="none" stroke="#0f0f11" stroke-width="1.6"/><path d="M2.5 9.5h19" stroke="#0f0f11" stroke-width="1.6"/><rect x="5.5" y="13" width="5" height="2.4" rx="1" fill="#2b5ce6"/></svg>
    OpenCard DB
  </div>

  <h1>The open database<br>of credit cards.</h1>

  <!-- Three card outlines in ISO 7810 proportions (85.60 by 53.98 mm). -->
  <svg class="cards" viewBox="0 0 520 420" aria-hidden="true">
    <g transform="translate(150 6)">
      <rect width="380" height="240" rx="18" fill="#f4f4f6" stroke="#e8e8ec" stroke-width="1.5"/>
    </g>
    <g transform="translate(75 92)">
      <rect width="380" height="240" rx="18" fill="#fafafa" stroke="#dcdce2" stroke-width="1.5"/>
    </g>
    <g transform="translate(0 178)">
      <rect width="380" height="240" rx="18" fill="#ffffff" stroke="#c9c9d1" stroke-width="1.5"/>
      <rect x="32" y="40" width="50" height="38" rx="7" fill="none" stroke="#b5b5be" stroke-width="1.5"/>
      <path d="M32 59h14M68 59h14M57 40v38" stroke="#c9c9d1" stroke-width="1.2"/>
      <rect x="32" y="150" width="160" height="10" rx="5" fill="#e8e8ec"/>
      <rect x="32" y="176" width="96" height="10" rx="5" fill="#e8e8ec"/>
      <rect x="296" y="182" width="52" height="24" rx="5" fill="#2b5ce6"/>
    </g>
  </svg>

  <div class="url">thedavidweng.github.io/opencard-db</div>
</div>
</body>
</html>
