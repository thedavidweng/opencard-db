<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenCard DB og:image source (1200x630)</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* Render at exactly 1200x630 and screenshot:
     playwright screenshot --viewport-size=1200,630 og.html og.png */
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .og {
    position: relative;
    width: 1200px;
    height: 630px;
    background: var(--plum);
    display: flex;
    align-items: center;
    padding: 0 90px;
  }
  .og #rosette-large {
    position: absolute;
    width: 900px;
    height: 900px;
    top: -140px;
    right: -260px;
    opacity: 0.3;
    fill: none;
    stroke: var(--gold);
    stroke-width: 0.7;
  }
  .og-copy { position: relative; max-width: 640px; }
  .og-brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 34px;
    color: var(--ivory);
    font-weight: 600;
    font-size: 26px;
  }
  .og-brand .brand-mark { width: 40px; height: 40px; }
  .og h1 {
    margin: 0 0 26px;
    font-weight: 780;
    font-stretch: 122%;
    font-size: 74px;
    line-height: 1.04;
    letter-spacing: -0.028em;
    color: var(--ivory);
  }
  .og p {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 19px;
    letter-spacing: 0.04em;
    color: var(--gold);
    white-space: nowrap;
  }
  .og-card {
    position: absolute;
    right: 74px;
    bottom: -60px;
    width: 400px;
    transform: rotate(-6deg);
  }
</style>
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<div class="og">
  <svg id="rosette-large" viewBox="0 0 900 900" aria-hidden="true"></svg>
  <div class="og-copy">
    <div class="og-brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="16" cy="16" r="6.2" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="16" cy="16" r="3.4" fill="none" stroke="currentColor" stroke-width="1"/>
      </svg>
      OpenCard&nbsp;DB
    </div>
    <h1>The open database of credit&nbsp;cards.</h1>
    <p>US · CA · CN &nbsp;·&nbsp; JSON · CSV · YAML &nbsp;·&nbsp; free CDN</p>
  </div>
  <div class="og-card">
    <div class="specimen" aria-hidden="true">
      <svg class="specimen-engraving" id="rosette-card" viewBox="0 0 640 400"></svg>
      <div class="specimen-top">
        <span class="specimen-brand">OPENCARD&nbsp;DB</span>
        <span class="specimen-tag">SPECIMEN</span>
      </div>
      <div class="chip"></div>
      <div class="specimen-number">•••• &nbsp;•••• &nbsp;•••• &nbsp;0189</div>
      <div class="specimen-bottom">
        <div>
          <span class="specimen-label">Cardholder</span>
          <span class="specimen-value">OPEN SOURCE COMMUNITY</span>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="main.js"></script>
</body>
</html>
