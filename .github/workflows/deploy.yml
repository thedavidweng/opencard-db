name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys so batched PR merges don't race on KV writes.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits so the jsDelivr purge step can diff images/ changed
          # by this push (squash merges: HEAD^ is the previous main).
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate cards
        run: bun run validate
      - name: Build indexes
        run: bun run build:indexes
      # Account id and the production KV namespace id live in
      # worker/cloudflare.config.ts (they are identifiers, not secrets), so the
      # only secret CI needs is CLOUDFLARE_API_TOKEN (Workers Scripts:Edit +
      # Workers KV Storage:Edit on this account). The worker's pinned cf CLI
      # is used instead of an unpinned global install.
      - name: Upload to Cloudflare KV and optional Worker deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_DEPLOY: ${{ secrets.WORKER_DEPLOY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not configured; skipping KV upload and Worker deploy (exit 0)."
            exit 0
          fi
          bun install --cwd worker --frozen-lockfile
          bun scripts/upload-kv.ts
          if [ "$WORKER_DEPLOY" = "true" ]; then
            echo "WORKER_DEPLOY=true; deploying Worker (env: production)..."
            bun run --cwd worker deploy:production
          else
            echo "WORKER_DEPLOY not true; KV uploaded only."
          fi
      # jsDelivr caches branch (@main) files for up to 7 days and does not
      # refresh on push, so the exports (and repo-hosted card art, whose
      # derived image.url points at @main) can go stale. Ask jsDelivr's purge
      # API to drop them after the KV upload. Best-effort: a failed or
      # throttled purge warns, never fails the deploy.
      - name: Purge jsDelivr @main cache
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          files="exports/meta.json exports/cards-all.json exports/cards-by-id.json exports/index-country.json exports/index-issuer.json exports/index-network.json exports/index-network-tier.json exports/cards.csv exports/cards.yaml"
          # Images changed by this push: diff the whole push range when the
          # previous tip is fetchable, else fall back to HEAD^ (squash merge).
          base=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git fetch -q --depth=1 origin "$BEFORE"; then
            base="$BEFORE"
          elif git rev-parse -q --verify HEAD^ >/dev/null; then
            base="HEAD^"
          fi
          if [ -n "$base" ]; then
            if changed=$(git diff --name-only --diff-filter=AMR "$base" HEAD -- images/); then
              files="$files $(printf '%s\n' "$changed" | grep -E '\.(webp|png|jpe?g|svg)$' || true)"
            else
              echo "::warning::could not diff images/ against $base; purging exports only"
            fi
          fi
          failed=0
          for f in $files; do
            url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f"
            if resp=$(curl -fsS --retry 2 -m 60 "$url") \
              && printf '%s' "$resp" | jq -e '.status == "finished" and ([.paths[]?.throttled] | any | not)' >/dev/null; then
              echo "purge finished: $f"
            else
              echo "::warning::jsDelivr purge not confirmed for $f: ${resp:-request failed}"
              failed=1
            fi
          done
          [ "$failed" = 0 ] || echo "::warning::some jsDelivr purges were not confirmed; @main may serve stale files until the cache expires"
          # jsDelivr can resolve @main to the previous commit for a minute or
          # two after a push and re-cache the old file. Verify meta.json
          # against the committed export and re-purge until it matches.
          want=$(jq -r .generated_at exports/meta.json)
          for attempt in 1 2 3 4 5 6; do
            got=$(curl -fsS -m 30 "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/exports/meta.json" | jq -r .generated_at || true)
            if [ "$got" = "$want" ]; then
              echo "jsDelivr @main serves current exports (generated_at $want)"
              exit 0
            fi
            echo "jsDelivr @main meta.json generated_at '${got}' != '${want}' (attempt $attempt); waiting and re-purging exports"
            sleep 45
            for f in $files; do
              case "$f" in exports/*) curl -fsS --retry 2 -m 60 -o /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" || true ;; esac
            done
          done
          echo "::warning::jsDelivr @main still serves stale exports/meta.json after re-purging; it should refresh when the CDN cache expires"
