name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys so batched PR merges don't race on KV writes.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits so the jsDelivr purge step can diff images/ changed
          # by this push (squash merges: HEAD^ is the previous main).
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate cards
        run: npm run validate
      - name: Build indexes
        run: npm run build:indexes
      # Account id and the production KV namespace id live in
      # worker/wrangler.jsonc (they are identifiers, not secrets), so the only
      # secret CI needs is CLOUDFLARE_API_TOKEN (Workers Scripts:Edit +
      # Workers KV Storage:Edit on this account). The worker's pinned cf CLI
      # is used instead of an unpinned global install.
      - name: Upload to Cloudflare KV and optional Worker deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_DEPLOY: ${{ secrets.WORKER_DEPLOY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not configured; skipping KV upload and Worker deploy (exit 0)."
            exit 0
          fi
          npm ci --prefix worker
          node --experimental-strip-types scripts/upload-kv.ts
          if [ "$WORKER_DEPLOY" = "true" ]; then
            echo "WORKER_DEPLOY=true; deploying Worker (env: production)..."
            npm run deploy:production --prefix worker
          else
            echo "WORKER_DEPLOY not true; KV uploaded only."
          fi
      # jsDelivr caches branch (@main) files for up to 7 days and does not
      # refresh on push, so the exports (and repo-hosted card art, whose
      # derived image.url points at @main) can go stale. Purge them after the
      # KV upload. Best-effort: a purge failure warns, never fails the deploy.
      - name: Purge jsDelivr @main cache
        run: |
          files="exports/meta.json exports/cards-all.json exports/cards-by-id.json exports/index-country.json exports/index-issuer.json exports/index-network.json exports/index-network-tier.json exports/cards.csv exports/cards.yaml"
          if git rev-parse -q --verify HEAD^ >/dev/null; then
            changed=$(git diff --name-only --diff-filter=AMR HEAD^ HEAD -- images/ | grep -E '\.(webp|png|jpe?g|svg)$' || true)
            files="$files $changed"
          fi
          failed=0
          for f in $files; do
            url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f"
            if curl -fsS --retry 2 -m 30 -o /dev/null "$url"; then
              echo "purged $f"
            else
              echo "::warning::jsDelivr purge failed for $f"
              failed=1
            fi
          done
          [ "$failed" = 0 ] || echo "::warning::some jsDelivr purges failed; @main may serve stale files until the cache expires"
