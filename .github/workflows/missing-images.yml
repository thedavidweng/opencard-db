# Weekly sweep for cards missing card-face images.
# find-missing-images.ts scans every card JSON and lists the ones with no
# `image.url` and no `image.local_path`, grouped by issuer. This workflow
# renders that report into a single tracking issue ("Tracking: cards missing
# card images") so contributors can see which cards still need art and where
# to source it (Apple Pay extract preferred — see issue #34).
#
# The issue body is rewritten in full each run, so the list stays in sync with
# the data without growing stale. A hidden HTML comment marks the issue so the
# workflow can find it again next week.
#
# Runs on the base repo with GITHUB_TOKEN — no PR / fork code involved.

name: Missing card images

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/find-missing-images.ts
      - .github/workflows/missing-images.yml

permissions:
  issues: write
  contents: read

concurrency:
  group: missing-images
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find cards missing images
        run: |
          node --experimental-strip-types scripts/find-missing-images.ts > /tmp/missing.json
          echo "----- missing-image report -----"
          cat /tmp/missing.json
          echo "--------------------------------"

      - name: Render tracking issue body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --experimental-strip-types <<'NODE' > /tmp/issue-body.md
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("/tmp/missing.json", "utf8"));

          const lines = [];
          lines.push("<!-- opencard-missing-images-tracker -->");
          lines.push("");
          lines.push("> Auto-generated by the **Missing card images** workflow (`.github/workflows/missing-images.yml`).");
          lines.push("> Runs weekly — the body is rewritten in full each run, so this list always reflects the current `data/` tree.");
          lines.push("");
          lines.push(`Last updated: **${report.generated_at}** — **${report.total_missing}** card(s) across **${report.issuers.length}** issuer(s).`);
          lines.push("");
          lines.push("## How to fix a card below");
          lines.push("");
          lines.push("1. **Preferred — Apple Pay extract.** On a Mac with the card in Wallet, run `npx opencard-export --export` (see [`packages/opencard-export`](packages/opencard-export)). It exports the card face named after the matched Card Id and prints the attribution. Then open a `card(update): <card-id>` PR with `image.local_path` set to the generated `images/<card-id>.webp`.");
          lines.push("2. **Official issuer image URL.** Find the card art on the issuer's product page and set `image.url` + `image.attribution` in a `card(update): <card-id>` PR.");
          lines.push("3. **Other upload.** Marketing PNG/JPG when no Apple Pay / official URL is available. Add under `images/` and set `image.local_path`.");
          lines.push("");
          lines.push("See [issue #34](https://github.com/thedavidweng/opencard-db/issues/34) for the Apple Pay card-art research trail.");
          lines.push("");

          if (report.total_missing === 0) {
            lines.push("## 🎉 Every card has an image!");
            lines.push("");
            lines.push("Nothing to do this week.");
          } else {
            for (const issuer of report.issuers) {
              lines.push(`## ${issuer.issuer_name} (\`${issuer.issuer_id}\`) — ${issuer.cards.length}`);
              lines.push("");
              lines.push("| Card ID | Name | Status | Product page |");
              lines.push("| --- | --- | --- | --- |");
              for (const c of issuer.cards) {
                const idLink = `[\`${c.id}\`](https://github.com/thedavidweng/opencard-db/blob/main/${c.file})`;
                const name = (c.name || "").replace(/\|/g, "\\|");
                const status = c.status;
                const url = c.official_url
                  ? `[link](${c.official_url})`
                  : "—";
                lines.push(`| ${idLink} | ${name} | ${status} | ${url} |`);
              }
              lines.push("");
            }
          }

          process.stdout.write(lines.join("\n") + "\n");
          NODE

          echo "----- issue body (first 40 lines) -----"
          head -40 /tmp/issue-body.md
          echo "---------------------------------------"

      - name: Find or create the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Best-effort: ensure the tracking label exists.
          gh label create missing-image \
            --color F1C40F \
            --description "Card is missing its card-face image" 2>/dev/null \
            || gh label edit missing-image \
                 --color F1C40F \
                 --description "Card is missing its card-face image" 2>/dev/null \
            || true

          TRACKER_TITLE="Tracking: cards missing card images"

          # Look for an open issue with the hidden tracker marker.
          ISSUE_NUMBER=$(gh issue list --state open --limit 200 \
            --json number,body --jq '
              .[] | select(.body | contains("<!-- opencard-missing-images-tracker -->")) | .number
            ' 2>/dev/null | head -1)

          if [ -z "$ISSUE_NUMBER" ]; then
            # Fall back to an exact-title match.
            ISSUE_NUMBER=$(gh issue list --state open --search "in:title $TRACKER_TITLE" \
              --json title,number --jq "
                .[] | select(.title == \"$TRACKER_TITLE\") | .number
              " 2>/dev/null | head -1)
          fi

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "Creating new tracking issue…"
            gh issue create \
              --title "$TRACKER_TITLE" \
              --label missing-image \
              --body-file /tmp/issue-body.md
          else
            echo "Updating tracking issue #$ISSUE_NUMBER…"
            gh issue edit "$ISSUE_NUMBER" --body-file /tmp/issue-body.md
            # Make sure the label is present.
            gh issue edit "$ISSUE_NUMBER" --add-label missing-image 2>/dev/null || true
          fi
