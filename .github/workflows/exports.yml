name: Refresh exports

# Regenerates the committed exports/ directory so the jsDelivr-servable @main
# files stay reasonably fresh. Tag-pinned production URLs get fresh exports
# from the release-please workflow (committed onto the release PR), so
# per-push freshness is not required here.
#
# Why a PR instead of a direct push: main's branch protection requires status
# checks, which rejects direct pushes from github-actions[bot] (GH006). The
# PR is opened with RELEASE_PLEASE_TOKEN (a PAT) when configured so CI runs
# on it and a maintainer can merge normally. With the default GITHUB_TOKEN
# fallback the PR does not trigger CI (GitHub's anti-recursion rule) and
# needs a close/re-open or an admin merge.

on:
  workflow_dispatch:

concurrency:
  group: exports-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate cards
        run: npm run validate
      - name: Build exports
        run: npm run build:exports
      - name: Open refresh PR if exports changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          add-paths: exports/
          branch: bot/refresh-exports
          commit-message: "chore(exports): refresh generated exports"
          title: "chore(exports): refresh generated exports"
          body: |
            ## What kind of change is this?

            - [x] **Not a card** (docs / CI / code / bulk data maintenance)

            Manual regeneration of the committed `exports/` directory (jsDelivr `@main` preview path).
          labels: enhancement
          delete-branch: true
