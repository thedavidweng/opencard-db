name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate cards
        run: npm run validate
      - name: Typecheck (root scripts + worker)
        run: |
          npm ci --prefix worker
          npm run typecheck
      - name: Build indexes
        run: npm run build:indexes
      - name: Test
        run: npm test
