# PR Triage (Homebrew Cask–style helpers)

# Labels regions, checks the beginner PR form + title, and leaves a sticky comment
# when something is missing. Does not merge or close PRs automatically.

name: PR Triage

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ensure() {
            local name="$1" color="$2" desc="$3"
            gh label create "$name" --color "$color" --description "$desc" 2>/dev/null || \
              gh label edit "$name" --color "$color" --description "$desc" 2>/dev/null || true
          }
          ensure "US" "0052CC" "Touches United States card data or images"
          ensure "CA" "D93F0B" "Touches Canada card data or images"
          ensure "CN" "FBCA04" "Touches China card data or images"
          ensure "new-card" "0E8A16" "Adds a new Card JSON file"
          ensure "enhancement" "a2eeef" "Non-card feature / CI / tooling change"
          ensure "documentation" "0075ca" "Docs-only change"
          ensure "needs-info" "D4C5F9" "Waiting on author for missing PR form fields"
          ensure "pr-form-incomplete" "E4E669" "PR body/title missing required beginner-form fields"
          ensure "missing-sources" "B60205" "Card PR is missing official source URLs"
          ensure "title-needs-fix" "F9D0C4" "PR title does not match Add/Update card or docs/ci convention"

      - name: Collect changed files
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" --name-only > /tmp/pr-files.txt || true
          wc -l < /tmp/pr-files.txt | tr -d ' ' | xargs -I{} echo "count={}" >> "$GITHUB_OUTPUT"

      - name: Run triage
        id: triage
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          export PR_FILES="$(cat /tmp/pr-files.txt)"
          set +e
          node --experimental-strip-types scripts/run-pr-triage.ts > /tmp/triage.json
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/triage.json

      - name: Apply labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ADD=$(node -e "const t=require('/tmp/triage.json'); console.log((t.labelsAdd||[]).join('\n'))")
          REM=$(node -e "const t=require('/tmp/triage.json'); console.log((t.labelsRemove||[]).join('\n'))")
          while IFS= read -r l; do
            [ -z "$l" ] && continue
            gh pr edit "$PR" --add-label "$l" || true
          done <<< "$ADD"
          while IFS= read -r l; do
            [ -z "$l" ] && continue
            gh pr edit "$PR" --remove-label "$l" || true
          done <<< "$REM"

      - name: Auto-fix PR title when we can infer it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const { execSync } = require("child_process");
          const t = require("/tmp/triage.json");
          if (t.titleOk) process.exit(0);
          if (!t.suggestedTitle) process.exit(0);
          const pr = process.env.PR;
          console.log("Updating title to:", t.suggestedTitle);
          execSync(`gh pr edit ${pr} --title ${JSON.stringify(t.suggestedTitle)}`, {
            stdio: "inherit",
          });
          NODE
          # Re-run triage after title fix so labels/comment match
          export PR_TITLE="$(gh pr view "$PR" --json title -q .title)"
          export PR_BODY="$(gh pr view "$PR" --json body -q .body)"
          export PR_FILES="$(cat /tmp/pr-files.txt)"
          set +e
          node --experimental-strip-types scripts/run-pr-triage.ts > /tmp/triage.json
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          ADD=$(node -e "const t=require('/tmp/triage.json'); console.log((t.labelsAdd||[]).join('\n'))")
          REM=$(node -e "const t=require('/tmp/triage.json'); console.log((t.labelsRemove||[]).join('\n'))")
          while IFS= read -r l; do [ -z "$l" ] && continue; gh pr edit "$PR" --add-label "$l" || true; done <<< "$ADD"
          while IFS= read -r l; do [ -z "$l" ] && continue; gh pr edit "$PR" --remove-label "$l" || true; done <<< "$REM"

      - name: Upsert sticky triage comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          node -e "const t=require('/tmp/triage.json'); require('fs').writeFileSync('/tmp/triage-comment.md', t.commentMarkdown)"
          MARKER='opencard-triage'
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING}" \
              -F body=@/tmp/triage-comment.md
          else
            gh pr comment "$PR" --body-file /tmp/triage-comment.md
          fi

      - name: Fail when title or required form fields are incomplete
        run: |
          # Exit directly from node — do not capture process.exit() via $(...),
          # which only captures stdout and leaves an empty exit argument.
          node -e "const t=require('/tmp/triage.json'); process.exit((!t.titleOk || (t.missing||[]).length) ? 1 : 0)"
