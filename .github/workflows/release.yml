name: Release

# On a v* tag push: validate, build the committed exports, and publish a GitHub
# Release with the generated catalog files attached as downloadable assets.
# Tag-pinned jsDelivr URLs (cdn.jsdelivr.net/gh/<owner>/opencard-db@<tag>/exports/*)
# are the recommended immutable production path; these Release assets are a
# convenient direct-download mirror of the same artifacts.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate cards
        run: npm run validate
      - name: Build exports
        run: npm run build:exports
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            exports/*.json
            exports/cards.csv
            exports/cards.yaml
