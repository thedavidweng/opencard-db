version: 2
updates:
  # Keep GitHub Actions pinned in .github/workflows up to date.
  - package-ecosystem: github-actions
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Root npm project (schema, scripts, tests).
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
  - package-ecosystem: npm
    groups:
      non-major:
        update-types:
          - "minor"
          - "patch"
    directory: "/"
    schedule:
      interval: weekly

  # Cloudflare Worker package.
    cooldown:
      default-days: 7
      semver-major-days: 10
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: npm
    groups:
      non-major:
        update-types:
          - "minor"
          - "patch"
    directory: "/worker"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 10
      semver-minor-days: 7
      semver-patch-days: 3
