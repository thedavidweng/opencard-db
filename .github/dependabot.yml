version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly

    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
  # Root Bun project (schema, scripts, tests).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: weekly

    # Test fixture mirror, not a shipped dependency: `release-please` is pinned to the
    # exact version bundled inside the SHA-pinned release-please-action, and
    # `tests/release/release.test.mjs` fails if the two disagree. Upgrade it together
    # with the action pin, never on its own.
    ignore:
      - dependency-name: "release-please"
    groups:
      non-major:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
      semver-major-days: 10
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: "bun"
    directory: "/worker"
    schedule:
      interval: weekly
    groups:
      non-major:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
      semver-major-days: 10
      semver-minor-days: 7
      semver-patch-days: 3
